name: MJM Content Queue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Process scheduled content
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi
          curl --fail-with-body --retry 2 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://mjm-social-bot.vercel.app/api/queue/run
