name: MJM Content Queue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Check queue configuration
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Queue paused: CRON_SECRET is not configured yet."
            echo "No request will be sent until the secret exists in GitHub Actions and Vercel."
            exit 0
          fi

      - name: Process scheduled content
        if: ${{ secrets.CRON_SECRET != '' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://mjm-social-bot.vercel.app/api/queue/run
